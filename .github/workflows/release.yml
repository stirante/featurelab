  #       with:
  #         node-version: "22"

  #     - uses: actions/download-artifact@v4
  #       with:
  #         pattern: "vsix-*"
  #         path: dist
  #         merge-multiple: true

  #     - name: List VSIXes
  #       run: ls -la dist

  #     - name: Publish to the VS Code Marketplace
  #       if: env.VSCE_PAT != ''
  #       run: npx --yes @vscode/vsce@3 publish --packagePath dist/*.vsix

